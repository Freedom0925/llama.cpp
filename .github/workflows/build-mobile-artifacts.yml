name: Build mobile artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-aar:
    name: Android arm64 AAR
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android build packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6"

      - name: Build release AAR
        working-directory: examples/llama.android
        run: ./gradlew :lib:assembleRelease -Pllama.android.abis=arm64-v8a --no-daemon

      - name: Upload Android AAR
        uses: actions/upload-artifact@v6
        with:
          name: llama-android-arm64-aar
          path: examples/llama.android/lib/build/outputs/aar/*.aar

  ios-static-xcframework:
    name: iOS arm64 static XCFramework
    runs-on: macos-latest

    env:
      IOS_MIN_VERSION: "16.4"

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Xcode
        uses: ggml-org/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS device static libraries
        run: |
          cmake -B build-ios-device -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_MIN_VERSION}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_METAL_USE_BF16=ON \
            -DGGML_BLAS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -S .
          cmake --build build-ios-device --config Release -- -quiet CODE_SIGNING_ALLOWED=NO

      - name: Build iOS simulator static libraries
        run: |
          cmake -B build-ios-sim -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_MIN_VERSION}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_METAL_USE_BF16=ON \
            -DGGML_BLAS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -S .
          cmake --build build-ios-sim --config Release -- -quiet CODE_SIGNING_ALLOWED=NO

      - name: Package static XCFramework
        run: |
          mkdir -p build-apple/Headers build-apple/device build-apple/simulator

          cp include/llama.h build-apple/Headers/
          cp ggml/include/ggml.h build-apple/Headers/
          cp ggml/include/ggml-alloc.h build-apple/Headers/
          cp ggml/include/ggml-backend.h build-apple/Headers/
          cp ggml/include/ggml-blas.h build-apple/Headers/
          cp ggml/include/ggml-cpu.h build-apple/Headers/
          cp ggml/include/ggml-metal.h build-apple/Headers/
          cp ggml/include/ggml-opt.h build-apple/Headers/
          cp ggml/include/gguf.h build-apple/Headers/

          cat > build-apple/Headers/module.modulemap <<'EOF'
          module llama {
            header "llama.h"
            header "ggml.h"
            header "ggml-alloc.h"
            header "ggml-backend.h"
            header "ggml-blas.h"
            header "ggml-cpu.h"
            header "ggml-metal.h"
            header "ggml-opt.h"
            header "gguf.h"

            link "c++"
            link framework "Accelerate"
            link framework "Foundation"
            link framework "Metal"

            export *
          }
          EOF

          xcrun libtool -static -o build-apple/device/libllama.a \
            build-ios-device/src/Release-iphoneos/libllama.a \
            build-ios-device/ggml/src/Release-iphoneos/libggml.a \
            build-ios-device/ggml/src/Release-iphoneos/libggml-base.a \
            build-ios-device/ggml/src/Release-iphoneos/libggml-cpu.a \
            build-ios-device/ggml/src/ggml-blas/Release-iphoneos/libggml-blas.a \
            build-ios-device/ggml/src/ggml-metal/Release-iphoneos/libggml-metal.a

          xcrun libtool -static -o build-apple/simulator/libllama.a \
            build-ios-sim/src/Release-iphonesimulator/libllama.a \
            build-ios-sim/ggml/src/Release-iphonesimulator/libggml.a \
            build-ios-sim/ggml/src/Release-iphonesimulator/libggml-base.a \
            build-ios-sim/ggml/src/Release-iphonesimulator/libggml-cpu.a \
            build-ios-sim/ggml/src/ggml-blas/Release-iphonesimulator/libggml-blas.a \
            build-ios-sim/ggml/src/ggml-metal/Release-iphonesimulator/libggml-metal.a

          xcodebuild -create-xcframework \
            -library build-apple/device/libllama.a -headers build-apple/Headers \
            -library build-apple/simulator/libllama.a -headers build-apple/Headers \
            -output build-apple/llama-ios-arm64-static.xcframework

      - name: Upload iOS static XCFramework
        uses: actions/upload-artifact@v6
        with:
          name: llama-ios-arm64-static-xcframework
          path: build-apple/llama-ios-arm64-static.xcframework
